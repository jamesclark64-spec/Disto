<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14232b">
<meta name="mobile-web-app-capable" content="yes">
<title>DISTO Room Plan</title>
<style>
:root{--ink:#14232b;--ink2:#51636d;--paper:#f3f1ec;--card:#fff;--line:#d9d5cc;--acc:#e0a100;--acc-ink:#2b2000;--ok:#1d7a4f;--bad:#b3261e;--sel:#0b6fb8}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:600 15px system-ui;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 12px;min-height:44px;cursor:pointer}
button:active{transform:translateY(1px)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.danger{color:var(--bad)}
button.armed{background:var(--sel);border-color:var(--sel);color:#fff}
input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;background:#fff;color:var(--ink);min-width:0;user-select:text;-webkit-user-select:text}
/* top bar */
header{flex:none;background:var(--ink);color:#fff;display:flex;gap:6px;align-items:center;padding:4px 6px;height:46px}
header button{background:transparent;border:0;color:#fff;min-height:38px;padding:6px 8px;display:grid;place-items:center}
#title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:15px}
#conn{border-radius:999px;padding:6px 12px;font-size:13px;background:#3a4d56}
#conn.on{background:var(--ok)}
/* stage */
#stage{flex:1;min-height:0;position:relative;background:#fff}
#plan{position:absolute;left:4px;top:70px;width:calc(100% - 8px);height:calc(100% - 226px);touch-action:manipulation}
.sheetOpen #plan{top:64px;height:calc(100% - 70px)}
#hud{position:absolute;left:8px;top:6px;right:8px;pointer-events:none}
#last{font:700 30px/1 ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#last small{font-size:13px;color:var(--ink2);font-weight:600;margin-left:5px}
#target{font-size:14px;color:var(--ink2);margin-top:3px}#target b{color:var(--sel)}
#stats{font-size:12px;color:var(--ink2);margin-top:1px;font-variant-numeric:tabular-nums}
#stats .bad{color:var(--bad);font-weight:700}#stats .ok{color:var(--ok);font-weight:700}
#pad{position:absolute;left:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:3px;transform-origin:bottom left}
#pad button{padding:0;min-height:0;font-size:22px;border-radius:12px;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.18)}
#pad button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#pad .turn{font-size:17px;color:var(--ink2);border-radius:50%}
#pad.dim{opacity:.35;pointer-events:none}
.sheetOpen #pad{transform:scale(.72);opacity:.9}
#fabs{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#fabs button{width:58px;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:700;border-radius:14px;background:rgba(255,255,255,.95);box-shadow:0 1px 4px rgba(0,0,0,.18)}
#fabs button.pri{background:var(--acc)}
#fabs button:disabled{display:none}
#fabs .t{font:800 15px ui-monospace,monospace;height:24px;display:grid;place-items:center}
.sheetOpen #fabs{display:none}
/* bottom sheet */
#sheet{flex:none;max-height:52dvh;overflow:auto;background:var(--paper);border-top:2px solid var(--ink);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.sh-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.sh-hd b{font:700 18px ui-monospace,Menlo,Consolas,monospace}
.sh-hd .adj{font-size:12px;color:var(--ink2)}
.sh-hd .x{margin-left:auto;min-height:36px;padding:4px 12px;font-size:18px}
.sh-hd .bk{min-height:36px;padding:4px 12px;font-size:20px}
.n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tools button{padding:5px 0 3px;min-height:50px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700}
.tools svg.ic{width:26px;height:26px}
.t-door{color:var(--ok)}.t-window{color:var(--sel)}.t-beam{color:#8a3fb8}.t-slope{color:#c96a00}.t-wc,.t-sink,.t-rad{color:#00796b}.t-start{color:var(--sel)}.t-note{color:var(--bad)}
textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;user-select:text;-webkit-user-select:text;resize:none}
.fld.wait{color:var(--sel);font-weight:700}.fld.wait input{border:2px solid var(--sel);background:#e6f2fb}
.sh-hd .skip{margin-left:auto;min-height:36px;padding:4px 12px;color:var(--sel);border-color:var(--sel)}.sh-hd .kb{margin-left:auto;min-height:36px;padding:4px 10px;font:800 13px ui-monospace,monospace}.sh-hd .skip+.kb,.sh-hd .kb+.x{margin-left:0}
.mini{display:flex;align-items:center;gap:4px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.mini span{font-size:11px;color:var(--ink2);margin-right:auto}
.mini button{min-height:38px;width:38px;padding:0;display:grid;place-items:center}
.mini svg.ic{width:22px;height:22px}
#target.go b{background:var(--sel);color:#fff;border-radius:6px;padding:1px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.chips svg.ic{width:20px;height:20px}
.hint{font-size:13px;color:var(--ink2);margin-top:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fld{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2)}
.in{display:flex;gap:6px}.in input{flex:1;width:0}
.in button{flex:none;min-width:44px;padding:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.grow{flex:1}
.mt{margin-top:8px}
/* menu */
#menu{position:fixed;inset:0;z-index:20;background:var(--paper);overflow:auto;padding:0 10px 30px}
#menu .mh{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:8px 0;z-index:1}
#menu h1{font-size:18px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
.fld input,.fld select{width:100%}
label.chk{display:flex;gap:8px;align-items:center;font-size:15px;min-height:36px}
label.chk input{min-height:0;width:22px;height:22px}
.wrow{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.wrow:last-child{border:0}
.wrow .len{font:700 16px ui-monospace,Menlo,Consolas,monospace}.wrow .adj{font-size:12px;color:var(--ink2)}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
#log{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:220px;overflow:auto;background:#101a1f;color:#cfe3d6;border-radius:8px;padding:8px;margin-top:8px;user-select:text;-webkit-user-select:text}
#toast{position:fixed;left:50%;top:128px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center;z-index:30}
#toast.show{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
<header>
  <button id="bMenu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div id="title"></div>
  <button id="conn">Connect</button>
</header>
<div id="stage">
  <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="hud"><div id="last">–.–––<small></small></div><div id="target"></div><div id="stats"></div></div>
  <div id="pad"></div>
  <div id="fabs">
    <button id="bMeasure" class="pri" disabled><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Measure</button>
    <button id="bClose"></button>
    <button id="bKey"><span class="t">123</span>Type</button>
    <button id="bUndo"><svg class="ic" viewBox="0 0 24 24"><path d="M8 5L3 10l5 5M3 10h11a5.5 5.5 0 0 1 0 11h-3"/></svg>Undo</button>
  </div>
</div>
<div id="sheet" hidden></div>
</div>

<div id="menu" hidden>
  <div class="mh"><h1>Job &amp; settings <small id="ver" style="font-size:12px;font-weight:400;color:var(--ink2)"></small></h1><button data-closemenu>Done</button></div>
  <section class="card">
    <h2>Job</h2>
    <input id="job" placeholder="Job name / number" autocomplete="off" style="width:100%">
  </section>
  <section class="card">
    <h2>Room</h2>
    <div class="row"><select id="roomSel" class="grow"></select><button id="bAddRoom">+ Room</button><button id="bDelRoom" class="danger">Delete</button></div>
    <div class="grid2 mt">
      <label class="fld">Name<input id="roomName"></label>
      <label class="fld">Ceiling height<span class="in"><input id="roomH" inputmode="decimal"><button data-arm="h">◎</button></span></label>
    </div>
  </section>
  <section class="card">
    <h2>Walls</h2>
    <div id="walls"></div>
    <div class="row mt"><button id="bReset">Restore measured lengths</button></div>
  </section>
  <section class="card">
    <h2>Export</h2>
    <div class="grid2">
      <button id="xDxf" class="pri">DXF</button><button id="xCsv">CSV schedule</button>
      <button id="xPng">PNG image</button><button id="xJson">Save job file</button>
      <button id="bLoad">Open job file</button><button id="bNew" class="danger">New job</button>
    </div>
    <input type="file" id="fLoad" accept=".json,application/json" hidden>
  </section>
  <section class="card">
    <h2>Settings</h2>
    <div class="grid2">
      <label class="fld">Units<select id="sUnit"><option value="m">Metres</option><option value="mm">Millimetres</option></select></label>
      <label class="fld">Decimal places (m)<select id="sDp"><option>2</option><option>3</option></select></label>
      <label class="fld">DXF text height (m)<input id="sTh" inputmode="decimal"></label>
      <label class="fld">DXF drawing units<select id="sDu"><option value="m">Metres</option><option value="mm">Millimetres</option></select></label>
      <label class="fld">Auto-turn after each wall<select id="turn"><option value="1">Right</option><option value="3">Left</option><option value="0">Off</option></select></label>
    </div>
    <label class="chk mt"><input type="checkbox" id="autoWall"> Readings add walls</label>
    <label class="chk"><input type="checkbox" id="sAskH"> Ask for heights after each opening</label>
    <label class="chk"><input type="checkbox" id="sDims"> Show wall dimensions</label>
    <label class="chk"><input type="checkbox" id="sLabel"> Show room label</label>
  </section>
  <section class="card">
    <h2>Bluetooth</h2>
    <div class="row"><button id="bLaser" disabled>Laser on</button><button id="bScanAll">Scan all devices</button><button id="bCopyLog">Copy log</button></div>
    <details id="diag"><summary>Diagnostics log</summary><div id="log"></div></details>
  </section>
</div>
<div id="toast"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const D=[[0,1],[1,0],[0,-1],[-1,0]], DA=['↑','→','↓','←'], DN=['Up','Right','Down','Left'];
const KEY='disto-plan-v1',VER='build 10';
const newRoom=n=>({name:n,height:null,walls:[]});
let S={job:'',rooms:[newRoom('Room 1')],cur:0,nextDir:1,
  set:{unit:'m',dp:3,th:0.15,du:'m',dims:true,label:true,autoWall:true,turn:1}};
let lastT=0, sel=-1, ed=null, keypad=false, menu=false, armed=null, chain=false, undo=[], lastM=null;
const SEQ={door:['off','w','h'],window:['off','w','cill','head'],opening:['off','w','head']},FL={usb:'floor to beam (USB)',off:'position',w:'width',h:'height (DH)',cill:'cill height (CH)',head:'head height (HH)'};
function firstEmpty(i,e){
  const w=room().walls[i],a=e.split(':'),j=+a[1];
  if(a[0]==='o'&&w.ops[j]){const o=w.ops[j],f=SEQ[o.type].slice(2).find(f=>o[f]==null);return f&&S.set.askH!==false?`o:${i}:${j}:${f}`:null}
  if(a[0]==='b'&&w.beams?.[j])return w.beams[j].usb==null?`b:${i}:${j}:usb`:null;
  if(a[0]==='s'&&w.slopes?.[j]){const f=['top','bot'].find(f=>w.slopes[j][f]==null);return f?`s:${i}:${j}:${f}`:null}
  return null;
}
function nextArm(k){const a=k.split(':');if(a[0]==='f'){const fx=room().walls[+a[1]]?.fix?.[+a[2]];return chain&&fx&&fx.type!=='rad'&&a[3]==='off'?`f:${a[1]}:${a[2]}:out`:null}
  if(chain&&a[0]==='s'){const nx={off:'top',top:'bot'}[a[3]];return nx?`s:${a[1]}:${a[2]}:${nx}`:null}
  if(chain&&a[0]==='b'){const nx={off:'w',w:'usb'}[a[3]];return nx?`b:${a[1]}:${a[2]}:${nx}`:null}
  const o=room().walls[+a[1]]?.ops[+a[2]];if(!chain||a[0]!=='o'||!o)return null;const q=SEQ[o.type].slice(0,S.set.askH===false?2:9),nx=q[q.indexOf(a[3])+1];return nx?`o:${a[1]}:${a[2]}:${nx}`:null}

/* ---------- storage ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.rooms&&j.rooms.length){S=Object.assign(S,j);S.set=Object.assign({unit:'m',dp:3,th:0.15,du:'m',dims:true,label:true,autoWall:true,turn:1},j.set)}}catch(e){}}
function snap(){undo.push(JSON.stringify({rooms:S.rooms,cur:S.cur,nextDir:S.nextDir}));if(undo.length>60)undo.shift()}
const room=()=>S.rooms[S.cur];

/* ---------- formatting ---------- */
const fmt=m=>m==null||!isFinite(m)?'':S.set.unit==='mm'?String(Math.round(m*1000)):m.toFixed(S.set.dp);
const unitLbl=()=>S.set.unit;
function parse(s){const v=parseFloat(String(s).replace(',','.'));if(!isFinite(v))return null;return S.set.unit==='mm'?v/1000:v}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}

/* ---------- geometry ---------- */
function pts(r){let x=0,y=0;const p=[[0,0]];for(const w of r.walls){x+=D[w.dir][0]*w.len;y+=D[w.dir][1]*w.len;p.push([x,y])}return p}
function area(p){let a=0;for(let i=0;i<p.length;i++){const q=p[i],n=p[(i+1)%p.length];a+=q[0]*n[1]-n[0]*q[1]}return a/2}
function misclose(r){const p=pts(r),e=p[p.length-1];return[e[0],e[1]]}
function span(P,a,u,n,d,len){
  const closed=Math.hypot(P[P.length-1][0],P[P.length-1][1])<1e-3,V=closed?P.slice(0,-1):P,ts=[];
  for(let i=0;i<V.length;i++){const p=V[i],q=V[(i+1)%V.length],cp=(p[0]-a[0])*n[0]+(p[1]-a[1])*n[1],cq=(q[0]-a[0])*n[0]+(q[1]-a[1])*n[1];
    if((cp<=d)!==(cq<=d)){const f=(d-cp)/(cq-cp),x=p[0]+(q[0]-p[0])*f,y=p[1]+(q[1]-p[1])*f;ts.push((x-a[0])*u[0]+(y-a[1])*u[1])}}
  ts.sort((x,y)=>x-y);if(ts.length<2)return[0,len];
  const m=len/2;let best=[ts[0],ts[1]],bd=1e9;
  for(let k=0;k+1<ts.length;k+=2){const dd=m<ts[k]?ts[k]-m:m>ts[k+1]?m-ts[k+1]:0;if(dd<bd){bd=dd;best=[ts[k],ts[k+1]]}}
  return best;
}
function prims(r,th,opt){
  const P=pts(r),A=area(P),cw=A<=0,out=[];
  const FR=r.walls.map((w,i)=>{const u=D[w.dir];return{a:P[i],u,n:cw?[u[1],-u[0]]:[-u[1],u[0]]}});
  const bspan=(i,bm,clip)=>{
    const {a,u,n}=FR[i],w=r.walls[i],d=(bm.flip?-1:1)*(bm.off+bm.w/2);let [t0,t1]=span(P,a,u,n,d,w.len);
    if(clip&&bm.run&&bm.run!=='full'){
      const c=[a[0]+n[0]*d,a[1]+n[1]*d];let best=null;
      r.walls.forEach((w2,j)=>{if(w2.dir%2===w.dir%2)return;const f=FR[j];
        for(const b2 of w2.beams||[]){if(b2===bm||!(b2.w>0))continue;
          const [s0,s1]=bspan(j,b2,false),sc=(c[0]-f.a[0])*f.u[0]+(c[1]-f.a[1])*f.u[1];if(sc<s0-1e-6||sc>s1+1e-6)continue;
          const g2=b2.flip?-1:1,ts=[b2.off*g2,(b2.off+b2.w)*g2].map(o=>(f.a[0]+f.n[0]*o-a[0])*u[0]+(f.a[1]+f.n[1]*o-a[1])*u[1]),lo=Math.min(...ts),hi=Math.max(...ts);
          if(bm.run==='start'){if(lo>t0+1e-6&&(best==null||lo<best))best=lo}else if(hi<t1-1e-6&&(best==null||hi>best))best=hi}});
      if(best!=null){if(bm.run==='start')t1=best;else t0=best}
    }
    return[t0,t1];
  };
  r.walls.forEach((w,i)=>{
    const a=P[i],u=D[w.dir],n=cw?[u[1],-u[0]]:[-u[1],u[0]];
    const at=(t,d=0)=>[a[0]+u[0]*t+n[0]*d,a[1]+u[1]*t+n[1]*d];
    let t=0;
    const FX=(w.fix||[]).map(f=>w.rev?{...f,off:w.len-f.off}:f);
    for(const o of w.ops.map(o=>w.rev?{...o,off:w.len-o.off-o.w,hinge:o.hinge==='end'?'start':'end'}:o).sort((x,y)=>x.off-y.off)){
      const s=Math.max(t,Math.min(w.len,o.off)),e=Math.max(s,Math.min(w.len,o.off+o.w)),wd=e-s;
      if(wd<=0)continue;
      if(s>t)out.push({t:'line',l:'WALLS',a:at(t),b:at(s),wi:i});
      const hl=[];
      if(o.type==='door'){
        const far=o.hinge==='end',sg=o.swing==='out'?-1:1,hp=far?e:s,va=far?[-u[0],-u[1]]:u,vb=[n[0]*sg,n[1]*sg];
        out.push({t:'line',l:'DOORS',a:at(hp),b:at(hp,wd*sg)});
        let a1=Math.atan2(va[1],va[0]),a2=Math.atan2(vb[1],vb[0]);
        if(va[0]*vb[1]-va[1]*vb[0]<0)[a1,a2]=[a2,a1];
        out.push({t:'arc',l:'DOORS',c:at(hp),r:wd,a1,a2});
        if(o.h)hl.push('DH '+fmt(o.h));
      }else if(o.type==='window'){
        for(const d of[-.05,0,.05])out.push({t:'line',l:'WINDOWS',a:at(s,d),b:at(e,d)});
        out.push({t:'line',l:'WINDOWS',a:at(s,-.05),b:at(s,.05)},{t:'line',l:'WINDOWS',a:at(e,-.05),b:at(e,.05)});
        if(o.cill)hl.push('CH '+fmt(o.cill));
      }
      if(o.type!=='door'&&o.head)hl.push('HH '+fmt(o.head));
      const bump=FX.some(f=>f.type==='rad'&&!f.flip&&f.off>=s&&f.off<=e)?Math.max(0,(+FX.find(f=>f.type==='rad').out||.2)/th-.2):0;
      hl.forEach((tx,q)=>out.push({t:'text',l:'HEIGHTS',p:at((s+e)/2,th*(1.1+bump+1.15*q)),rot:w.dir%2===0?90:0,s:tx,h:th*.8}));
      t=e;
    }
    if(w.len>t)out.push({t:'line',l:'WALLS',a:at(t),b:at(w.len),wi:i});
    for(const bm of w.beams||[]){
      if(!(bm.w>0))continue;
      const [t0,t1]=bspan(i,bm,true);

function distribute(r){

}

/* ---------- DXF (R12 ASCII) ---------- */
function dxf(){
  const L=[],g=(c,v)=>L.push(c,v),f=v=>(+v).toFixed(4),k=S.set.du==='mm'?1000:1;
  const layers=[['WALLS',7],['DOORS',3],['WINDOWS',5],['DIMS',2],['HEIGHTS',4],['BEAMS',6,'DASHED'],['SLOPES',30,'DASHED'],['FIXTURES',1],['NOTES',8],['TEXT',7]];
  g(0,'SECTION');g(2,'HEADER');g(9,'$ACADVER');g(1,'AC1009');g(0,'ENDSEC');
  g(0,'SECTION');g(2,'TABLES');
  g(0,'TABLE');g(2,'LTYPE');g(70,2);g(0,'LTYPE');g(2,'CONTINUOUS');g(70,0);g(3,'Solid line');g(72,65);g(73,0);g(40,'0.0');
  g(0,'LTYPE');g(2,'DASHED');g(70,0);g(3,'Dashed __ __ __');g(72,65);g(73,2);g(40,f(.3*k));g(49,f(.2*k));g(49,f(-.1*k));g(0,'ENDTAB');
  g(0,'TABLE');g(2,'LAYER');g(70,layers.length);for(const[n,c,lt]of layers){g(0,'LAYER');g(2,n);g(70,0);g(62,c);g(6,lt||'CONTINUOUS')}g(0,'ENDTAB');
  g(0,'ENDSEC');g(0,'SECTION');g(2,'ENTITIES');
  let ox=0;
  for(const r of S.rooms){
    if(!r.walls.length)continue;
    const pr=prims(r,S.set.th,{dims:S.set.dims,label:S.set.label}),[x0,y0,x1]=bbox(pr),dx=ox-x0,dy=-y0;
    for(const p of pr){
      if(p.t==='line'){g(0,'LINE');g(8,p.l);g(10,f((p.a[0]+dx)*k));g(20,f((p.a[1]+dy)*k));g(30,'0.0');g(11,f((p.b[0]+dx)*k));g(21,f((p.b[1]+dy)*k));g(31,'0.0')}
      else if(p.t==='pt'){g(0,'POINT');g(8,p.l);g(10,f((p.p[0]+dx)*k));g(20,f((p.p[1]+dy)*k));g(30,'0.0')}
      else if(p.t==='arc'){const dg=a=>f(((a*180/Math.PI)%360+360)%360);g(0,'ARC');g(8,p.l);g(10,f((p.c[0]+dx)*k));g(20,f((p.c[1]+dy)*k));g(30,'0.0');g(40,f(p.r*k));g(50,dg(p.a1));g(51,dg(p.a2))}
      else{const x=f((p.p[0]+dx)*k),y=f((p.p[1]+dy)*k);g(0,'TEXT');g(8,p.l);g(10,x);g(20,y);g(30,'0.0');g(40,f(p.h*k));g(1,p.s.replace('²','\\U+00B2'));g(50,f(p.rot));g(72,1);g(73,2);g(11,x);g(21,y);g(31,'0.0')}
    }
    ox+=(x1-x0)+2;
  }
  g(0,'ENDSEC');g(0,'EOF');
  return L.join('\r\n')+'\r\n';
}
function csv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"',rows=[['Room','Item','Type','Direction','Measured (m)','Adjusted (m)','From wall start (m)','Width (m)','Cill CH (m)','Head HH (m)','Door height DH (m)','Hinge','Opens','Offset from wall (m)','USB (m)','Beam runs','Ceiling at top (m)','Ceiling at bottom (m)','High side']];
  for(const r of S.rooms){
    r.walls.forEach((w,i)=>{rows.push([r.name,'Wall '+(i+1),'wall',DN[w.dir],w.meas.toFixed(3),w.len.toFixed(3),'','']);
      const z=v=>v?v.toFixed(3):'';w.ops.forEach(o=>rows.push([r.name,'Wall '+(i+1),o.type,'','','',o.off.toFixed(3),o.w.toFixed(3),z(o.cill),z(o.head),z(o.h),o.type==='door'?(o.hinge==='end'?'far end':'start end'):'',o.type==='door'?(o.swing==='out'?'out':'in'):'']));
      (w.beams||[]).forEach(b=>rows.push([r.name,'Wall '+(i+1),'beam','','','','',b.w.toFixed(3),'','','','','',b.off.toFixed(3),z(b.usb),b.run==='start'?'start end to first beam':b.run==='end'?'far end to first beam':'wall to wall']));
      if(w.note)rows.push([r.name,'Wall '+(i+1),'note: '+w.note]);
      (w.fix||[]).forEach(b=>rows.push([r.name,'Wall '+(i+1),FXN[b.type],'','','',b.off.toFixed(3),'','','','','','',b.out.toFixed(3)]));
      (w.slopes||[]).forEach(b=>rows.push([r.name,'Wall '+(i+1),'sloping ceiling','','','','','','','','','','',b.off.toFixed(3),'','',z(b.top),z(b.bot),b.high==='wall'?'at wall':'at line']))});

function png(){

const SVC='3ab10100-f831-4395-b29d-570977d5bf94',C_DIST='3ab10101-f831-4395-b29d-570977d5bf94',C_UNIT='3ab10102-f831-4395-b29d-570977d5bf94',C_CMD='3ab10109-f831-4395-b29d-570977d5bf94';

const hex=dv=>[...new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength)].map(b=>b.toString(16).padStart(2,'0')).join(' ');
function setConn(on,name){$('conn').classList.toggle('on',on);$('conn').textContent=on?(name||'Connected'):(dev?'Reconnect':'Connect');$('bMeasure').disabled=$('bLaser').disabled=!(on&&cmd)}
let wantOff=false,busy=false,rt=null;
function bind(d){dev=d;d.addEventListener('gattserverdisconnected',()=>{log('Disconnected');cmd=null;setConn(false);autoRe()})}
function autoRe(){
  clearTimeout(rt);if(!dev||wantOff||dev.gatt.connected||document.visibilityState!=='visible')return;

async function connect(all){

}
async function attach(){
  if(busy)throw new Error('already connecting');busy=true;

  log('Connecting to '+(dev.name||'device')+' …');

    if(p.notify||p.indicate)try{if(!c._on){c._on=1;c.addEventListener('characteristicvaluechanged',ev=>onChar(c.uuid,ev.target.value))}await c.startNotifications()}catch(e){log(`  subscribe ${id} failed: ${e.message}`)}

function onChar(uuid,dv){

$('bLoad').onclick=()=>$('fLoad').click();
$('fLoad').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.rooms)throw 0;snap();S=Object.assign(S,j);sel=-1;ed=null;menu=false;render();toast('Job opened')}catch(x){toast('Not a valid job file')}e.target.value=''};
$('bNew').onclick=()=>{snap();S.job='';S.rooms=[newRoom('Room 1')];S.cur=0;S.nextDir=1;sel=-1;ed=null;menu=false;render();toast('New job – Undo to go back')};
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible')return;if(dev?.gatt.connected)try{wake=await navigator.wakeLock?.request('screen')}catch(e){}else autoRe()});
// pick up a DISTO this phone has already been paired with in this app, where Chrome allows it
(async()=>{try{const ds=await navigator.bluetooth?.getDevices?.();const d=ds?.find(x=>(x.name||'').startsWith('DISTO'));if(d&&!dev){bind(d);log('Known device: '+d.name);autoRe()}}catch(e){}})();

load();render();$('ver').textContent=VER;log('DISTO Room Plan '+VER);
</script>
</body>
</html>
